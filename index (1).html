<title>Coralia — Tiny Treasures</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style id="app-style">
:root{--bg:#FDFFF0;--card:#FFFFFB;--ink:#3a1519;--brand:#942936;--muted:#8a6a66;--line:#ecdcd0;--accent:#B83330;--accent-ink:#ffffff;--soft:#f8eee3;--danger:#a8281f;--ok:#942936;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;margin:0;font-weight:700;letter-spacing:.2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header.top{padding:26px 0 16px;text-align:center;position:relative}
header.top h1{font-size:clamp(34px,6vw,52px);line-height:1.05}
header.top p{color:var(--muted);margin:8px 0 0}
.editbtn{position:absolute;right:0;top:14px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0 6px}
.how div{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.how b{display:block;color:var(--accent);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
section{margin-top:30px}
section>h2{font-size:30px;margin-bottom:4px}
section>.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1/1;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:22px;line-height:1.1}
.tag{display:inline-block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.price{font-weight:600;font-size:17px}
.badge{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;width:fit-content}
.desc{color:var(--muted);font-size:13.5px;margin:0}
.soldout{opacity:.55}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mini .card .ph{font-size:42px}
.mini .card .bd{padding:8px 10px 10px;gap:3px}
.mini .card h3{font-size:17px}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:20}
.bar .in{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.spacer{height:96px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:34px}
.ov{position:fixed;inset:0;background:rgba(20,14,10,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));position:relative}
@media (min-width:760px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet.wide{max-width:860px}
.sheet h2{font-size:30px}
.x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:28px;color:var(--muted);cursor:pointer;line-height:1}
.hd{display:flex;gap:14px;align-items:center;margin:4px 0 12px;padding-right:26px}
.thumb{width:68px;height:68px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.s{width:44px;height:44px;font-size:22px;border-radius:10px}
.step{margin-top:16px}
.step h3{font-size:21px;margin-bottom:2px}
.step .sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pick{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px;cursor:pointer;font:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick.on{border-color:var(--accent);background:var(--soft)}
.pick:disabled{opacity:.45;cursor:default}
.pick .thumb{width:54px;height:54px;font-size:28px}
.pick small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:2px}
.stepper button{width:28px;height:28px;border-radius:99px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:17px;cursor:pointer;line-height:1;font-family:inherit}
.stepper span{min-width:16px;text-align:center;font-weight:600}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:60px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.line ul{margin:6px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13.5px}
.line li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.total{font-size:20px;font-weight:700}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.fld{display:block;margin-top:10px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer}
.chk input{margin-top:3px}
.preview{width:100%;border:1px solid var(--line);border-radius:12px;display:block;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.ed-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ed-actions{display:flex;gap:6px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:70px 1fr 110px;gap:8px}
.g2.c{grid-template-columns:70px 1fr 110px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;max-width:90%;font-size:14px}
.sticky-save{position:sticky;bottom:-22px;background:var(--bg);padding:12px 0 4px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:18px}
.empty{color:var(--muted);text-align:center;padding:22px 0}
.logo{width:min(290px,60vw);height:auto;display:block;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{color:var(--brand)}
.price{color:var(--brand)}
.thumb,.card .ph{background:var(--soft)}
</style>
</head>

/* ---------- pricing ---------- */
function lineTotal(l){const ch=chainById(l.chainId);let t=ch?ch.price:0;for(const id in l.extras){const c=charmById(id);if(c)t+=c.price*l.extras[id]}return t}
const cartTotal=()=>cart.reduce((s,l)=>s+lineTotal(l),0);

/* ---------- page ---------- */
function renderPage(){
  const s=data.shop;
  const types=['All',...Array.from(new Set(data.chains.map(c=>c.type)))];
  const chains=data.chains.filter(c=>filter==='All'||c.type===filter);
  const freeCount=data.charms.filter(c=>c.standard&&c.available!==false).length;
  $('#page').innerHTML=`<div class="wrap">
  <header class="top">${isOwner?`<button class="btn sm ghost editbtn" data-act="admin">✎ Edit catalog</button>`:''}
    <img class="logo" src="${LOGO}" alt="${esc(s.name)}"><h1 class="sr">${esc(s.name)}</h1><p>${esc(s.tagline)}</p></header>
  <div class="how">
    <div><b>1 · Pick a chain</b>Choose a bracelet or necklace.</div>
    <div><b>2 · Free charm</b>Every chain includes 1 standard charm — on us.</div>
    <div><b>3 · Add more</b>Add extra charms at their listed price.</div>
    <div><b>4 · Send your order</b>Save the order image and send it to us to confirm.</div>
  </div>
  <section><h2>Chains</h2><p class="sub">Each chain comes with one free standard charm (${freeCount} to choose from).</p>
    <div class="tabs">${types.map(t=>`<button class="tab ${t===filter?'on':''}" data-act="filter" data-v="${esc(t)}">${esc(t==='All'?'All':t+'s')}</button>`).join('')}</div>
    <div class="grid">${chains.map(c=>`<div class="card ${c.available===false?'soldout':''}">
      <div class="ph">${c.img?`<img src="${esc(c.img)}" alt="${esc(c.name)}">`:esc(c.emoji||'✨')}</div>
      <div class="bd"><span class="tag">${esc(c.type)}</span><h3>${esc(c.name)}</h3>
      <p class="desc">${esc(c.desc)}</p><span class="badge">+ 1 free standard charm</span>
      <div class="row" style="margin-top:auto;padding-top:6px"><span class="price">${money(c.price)}</span>
      ${c.available===false?'<span class="tag">Sold out</span>':`<button class="btn sm" data-act="build" data-id="${c.id}">Customize</button>`}</div></div></div>`).join('')||'<div class="empty">No chains listed yet.</div>'}</div>
  </section>
  <section><h2>Charms</h2><p class="sub">Standard charms are free as your included pick. Any charm can be added as an extra at the price shown.</p>
    <div class="mini">${data.charms.map(c=>`<div class="card ${c.available===false?'soldout':''}"><div class="ph">${c.img?`<img src="${esc(c.img)}" alt="${esc(c.name)}">`:esc(c.emoji||'✨')}</div>
      <div class="bd"><h3>${esc(c.name)}</h3><span class="price" style="font-size:15px">${money(c.price)}</span>
      ${c.available===false?'<span class="tag">Sold out</span>':c.standard?'<span class="badge">Free pick option</span>':''}</div></div>`).join('')||'<div class="empty">No charms listed yet.</div>'}</div>
  </section>
  <p class="foot">${esc(s.deliveryNote)}</p>
  <div class="spacer"></div></div>
  ${cart.length?`<div class="bar"><div class="in"><div><b>${cart.length} item${cart.length>1?'s':''}</b> · <span class="total" style="font-size:17px">${money(cartTotal())}</span></div><button class="btn" data-act="cart">View my order</button></div></div>`:''}`;
}

/* ---------- overlays ---------- */
function renderOverlay(){
  const o=$('#overlay');
  const keep=o.querySelector('.sheet');const st=keep?keep.scrollTop:0;
  if(!ov){o.innerHTML='';return}
  let html='';
  if(ov==='build')html=buildHtmlView();
  else if(ov==='cart')html=cartView();
  else if(ov==='review')html=reviewView();
  else if(ov==='admin')html=adminView();
  o.innerHTML=`<div class="ov" data-act="bg"><div class="sheet ${ov==='admin'||ov==='review'?'wide':''}" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close">×</button>${html}</div></div>`;
  const sh=o.querySelector('.sheet');if(sh)sh.scrollTop=st;
}
function buildHtmlView(){
  const b=builder,ch=chainById(b.chainId);
  const free=data.charms.filter(c=>c.standard);
  const extra=data.charms;
  let tot=ch.price;for(const id in b.extras){const c=charmById(id);if(c)tot+=c.price*b.extras[id]}
  return `<div class="hd">${thumb(ch)}<div><span class="tag">${esc(ch.type)}</span><h2>${esc(ch.name)}</h2><div class="price">${money(ch.price)}</div></div></div>
  <div class="step"><h3>Your free charm</h3><p class="sub">Included with your chain — pick one.</p>
    <div class="picks">${free.length?free.map(c=>`<button class="pick ${b.freeId===c.id?'on':''}" data-act="free" data-id="${c.id}" ${c.available===false?'disabled':''}>${thumb(c)}<b>${esc(c.name)}</b><small>${c.available===false?'Sold out':'FREE'}</small></button>`).join(''):'<div class="empty">No standard charms listed yet.</div>'}</div></div>
  <div class="step"><h3>Add more charms <span class="tag">optional</span></h3><p class="sub">Each extra charm is priced separately.</p>
    <div class="picks">${extra.map(c=>`<div class="pick ${b.extras[c.id]?'on':''}" style="cursor:default;${c.available===false?'opacity:.45':''}">${thumb(c)}<b>${esc(c.name)}</b><small>${money(c.price)}</small>
      ${c.available===false?'<small>Sold out</small>':`<div class="stepper"><button data-act="qty" data-id="${c.id}" data-d="-1" aria-label="Less">−</button><span>${b.extras[c.id]||0}</span><button data-act="qty" data-id="${c.id}" data-d="1" aria-label="More">+</button></div>`}</div>`).join('')}</div></div>
  <label class="fld"><span>Length / size / notes for this item (optional)</span><input type="text" data-bind="b.note" value="${esc(b.note)}" placeholder="e.g. 17 cm wrist, initial letter “M”"></label>
  <div class="row" style="margin-top:16px"><div class="total">${money(tot)}</div><button class="btn" data-act="addline">${b.editIndex!=null?'Save changes':'Add to my order'}</button></div>`;
}
function cartView(){
  const s=data.shop;
  if(!cart.length)return `<h2>My order</h2><div class="empty">Your order is empty.</div>`;
  return `<h2>My order</h2>
  ${cart.map((l,i)=>{const ch=chainById(l.chainId),f=charmById(l.freeId);return `<div class="line"><div class="row"><div style="display:flex;gap:10px;align-items:center">${thumb(ch,'s')}<div><b>${esc(ch.name)}</b><br><span class="tag">${esc(ch.type)}</span></div></div><b>${money(lineTotal(l))}</b></div>
   <ul><li><span>${f?esc(f.name)+' (free charm)':'No free charm selected'}</span><span>FREE</span></li>
   ${Object.keys(l.extras).map(id=>{const c=charmById(id);return c?`<li><span>${esc(c.name)} × ${l.extras[id]}</span><span>${money(c.price*l.extras[id])}</span></li>`:''}).join('')}
   ${l.note?`<li><span>Note: ${esc(l.note)}</span><span></span></li>`:''}</ul>
   <div class="actions"><button class="btn sm ghost" data-act="editline" data-i="${i}">Edit</button><button class="btn sm danger" data-act="rmline" data-i="${i}">Remove</button></div></div>`}).join('')}
  <div class="row" style="margin-top:14px"><span>Total (items)</span><span class="total">${money(cartTotal())}</span></div>
  <div class="note">${esc(s.deliveryNote)}</div>
  <label class="fld"><span>Your name</span><input type="text" data-bind="c.name" value="${esc(customer.name)}" autocomplete="name"></label>
  <label class="fld"><span>Your contact (phone / Messenger / IG)</span><input type="text" data-bind="c.contact" value="${esc(customer.contact)}"></label>
  <label class="chk"><input type="checkbox" data-bind="c.delivery" ${customer.delivery?'checked':''}><span>I would like delivery (fee paid by me, confirmed by the shop)</span></label>
  ${customer.delivery?`<label class="fld"><span>Delivery address</span><textarea data-bind="c.address">${esc(customer.address)}</textarea></label>`:''}
  <div class="actions"><button class="btn" data-act="review">Create my order image</button><button class="btn ghost" data-act="close">Keep shopping</button></div>`;
}
function reviewView(){
  return `<h2>Your order is ready</h2>
  <p class="desc" style="margin:4px 0 12px">Save this image or PDF, then send it to us so we can confirm your order. ${esc(data.shop.contact)}</p>
  ${lastPng?`<img class="preview" src="${lastPng}" alt="Order summary">`:'<div class="empty">Preparing…</div>'}
  <div class="actions"><button class="btn" data-act="dlpng">Save as image</button><button class="btn ghost" data-act="dlpdf">Save as PDF</button><button class="btn ghost" data-act="cart">Back to order</button></div>
  <p class="desc" style="margin-top:10px">If saving doesn’t start on your device, press and hold the image above to save it, or take a screenshot.</p>`;
}

/* ---------- admin ---------- */
function adminView(){
  const s=draft.shop;
  const fld=(l,h)=>`<label class="fld"><span>${l}</span>${h}</label>`;
  const types=['Bracelet','Necklace','Anklet','Other'];
  const card=(k,it,i)=>`<div class="ed"><div class="ed-top">${thumb(it)}<div class="ed-actions">
    <label class="btn sm ghost" style="cursor:pointer">Upload photo<input type="file" accept="image/*" hidden data-file="${k}:${i}"></label>
    ${it.img?`<button class="btn sm ghost" data-act="imgrm" data-k="${k}" data-i="${i}">Remove photo</button>`:''}
    <button class="btn sm danger" data-act="del" data-k="${k}" data-i="${i}">Delete</button></div></div>
    <div class="g2"><input type="text" data-k="${k}" data-i="${i}" data-f="emoji" value="${esc(it.emoji)}" aria-label="Emoji" placeholder="✨">
    <input type="text" data-k="${k}" data-i="${i}" data-f="name" value="${esc(it.name)}" aria-label="Name" placeholder="Name">
    <input type="number" min="0" step="any" data-k="${k}" data-i="${i}" data-f="price" value="${it.price}" aria-label="Price"></div>
    ${k==='chains'?`<div class="g3"><select data-k="${k}" data-i="${i}" data-f="type">${types.map(t=>`<option ${it.type===t?'selected':''}>${t}</option>`).join('')}</select>
      <input type="text" data-k="${k}" data-i="${i}" data-f="desc" value="${esc(it.desc)}" placeholder="Short description"></div>`:''}
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">
    ${k==='charms'?`<label class="chk" style="margin:0"><input type="checkbox" data-k="${k}" data-i="${i}" data-f="standard" ${it.standard?'checked':''}><span>Standard charm (can be the free pick)</span></label>`:''}
    <label class="chk" style="margin:0"><input type="checkbox" data-k="${k}" data-i="${i}" data-f="available" ${it.available!==false?'checked':''}><span>In stock</span></label></div></div>`;
  return `<h2>Edit catalog</h2><p class="desc">Change anything below, then press <b>Download catalog.json</b> and upload that file to your GitHub repository (replace the old catalog.json). Your site updates within a minute or two.</p>
  <div class="step"><h3>Shop details</h3>
  ${fld('Shop name',`<input type="text" data-sf="name" value="${esc(s.name)}">`)}
  ${fld('Tagline',`<input type="text" data-sf="tagline" value="${esc(s.tagline)}">`)}
  ${fld('Currency symbol',`<input type="text" data-sf="currency" value="${esc(s.currency)}" style="max-width:120px">`)}
  ${fld('Where customers send their order image',`<input type="text" data-sf="contact" value="${esc(s.contact)}">`)}
  ${fld('Delivery note',`<textarea data-sf="deliveryNote">${esc(s.deliveryNote)}</textarea>`)}</div>
  <div class="step"><h3>Chains</h3><p class="sub">Emoji · Name · Price</p>${draft.chains.map((c,i)=>card('chains',c,i)).join('')}
  <div class="actions"><button class="btn ghost" data-act="add" data-k="chains">+ Add chain</button></div></div>
  <div class="step"><h3>Charms</h3><p class="sub">Emoji · Name · Price (price applies when added as an extra)</p>${draft.charms.map((c,i)=>card('charms',c,i)).join('')}
  <div class="actions"><button class="btn ghost" data-act="add" data-k="charms">+ Add charm</button></div></div>
  <div class="sticky-save"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save">Download catalog.json</button></div>`;
}
function resizeImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const M=360,r=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(file)})}

async function savePublish(){
  for(const c of draft.chains.concat(draft.charms)){c.name=(c.name||'').trim();if(!c.name){toast('Every chain and charm needs a name.');return}c.price=Number(c.price)||0}
  downloadBlob('catalog.json',new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));
  data=draft;ov=null;renderPage();renderOverlay();
  toast('catalog.json downloaded — upload it to GitHub (replace the old one) to publish.');
}

/* ---------- order image ---------- */
function newOrder(){
  return {id:'ORD-'+Date.now().toString(36).slice(-5).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase(),
    date:new Date().toLocaleString(),name:customer.name.trim(),contact:customer.contact.trim(),delivery:customer.delivery,address:customer.address.trim(),
    lines:cart.map(l=>({chain:chainById(l.chainId),free:charmById(l.freeId),extras:Object.keys(l.extras).map(id=>({charm:charmById(id),qty:l.extras[id]})).filter(x=>x.charm),note:l.note,total:lineTotal(l)})),
    total:cartTotal(),shop:data.shop};
}
const loadImg=src=>new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function paint(ctx,o,imgs){
  const W=900,P=44;let y=P;
  const FS='"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif',FR='"Cormorant Garamond",Georgia,serif';
  const txt=(s,x,yy,op)=>{op=op||{};ctx.font=(op.w||'400')+' '+(op.sz||20)+'px '+(op.f==='serif'?FR:FS);ctx.fillStyle=op.c||'#3a1519';ctx.textAlign=op.a||'left';ctx.textBaseline='alphabetic';let t=String(s);if(op.max){const n=t;while(ctx.measureText(t).width>op.max&&t.length>1)t=t.slice(0,-1);if(t!==n)t=t.slice(0,-1)+'…'}ctx.fillText(t,x,yy)};
  const wrap=(s,max,sz)=>{ctx.font='400 '+sz+'px '+FS;const words=String(s).split(/\s+/),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines};
  const th=(it,img,x,yy,s)=>{ctx.save();rr(ctx,x,yy,s,s,s*.2);ctx.clip();ctx.fillStyle='#f8eee3';ctx.fillRect(x,yy,s,s);if(img){const k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;ctx.drawImage(img,x+(s-w)/2,yy+(s-h)/2,w,h)}else{ctx.font='400 '+Math.round(s*.55)+'px '+FS;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#3a1519';ctx.fillText(it.emoji||'✨',x+s/2,yy+s/2+2)}ctx.restore()};
  const rule=()=>{ctx.strokeStyle='#ecdcd0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P,y);ctx.lineTo(W-P,y);ctx.stroke()};
  const cur=o.shop.currency,m=n=>cur+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});

  const lg=imgs.__logo;
  if(lg){const lh=128,lw=lg.width*lh/lg.height;ctx.drawImage(lg,P,y,lw,lh)}
  else txt(o.shop.name,P,y+50,{sz:42,w:'700',f:'serif',c:'#942936',max:420});
  txt('ORDER REQUEST',W-P,y+34,{sz:13,w:'600',c:'#B83330',a:'right'});
  txt(o.id,W-P,y+62,{sz:22,w:'600',a:'right'});
  txt(o.date,W-P,y+88,{sz:15,c:'#8a6a66',a:'right'});
  y+=128+22;rule();y+=30;
  if(o.name||o.contact){
    if(o.name){txt('Customer',P,y,{sz:13,c:'#8a6a66'});txt(o.name,P+110,y,{sz:19,w:'600',max:640});y+=30}
    if(o.contact){txt('Contact',P,y,{sz:13,c:'#8a6a66'});txt(o.contact,P+110,y,{sz:19,max:640});y+=30}
    y+=4;rule();y+=26;
  }
  o.lines.forEach((l,i)=>{
    th(l.chain,imgs[l.chain.id],P,y,76);
    txt(l.chain.name,P+94,y+30,{sz:23,w:'600',max:560});
    txt(l.chain.type+' · '+m(l.chain.price),P+94,y+58,{sz:16,c:'#8a6a66'});
    txt('#'+(i+1),W-P,y+30,{sz:15,c:'#8a6a66',a:'right'});
    y+=96;
    if(l.free){th(l.free,imgs[l.free.id],P+94,y-4,34);txt(l.free.name+'  ·  free standard charm',P+140,y+19,{sz:18,max:540});txt('FREE',W-P,y+19,{sz:18,w:'600',c:'#942936',a:'right'});y+=40}
    l.extras.forEach(x=>{th(x.charm,imgs[x.charm.id],P+94,y-4,34);txt(x.charm.name+'  ×  '+x.qty,P+140,y+19,{sz:18,max:480});txt(m(x.charm.price*x.qty),W-P,y+19,{sz:18,a:'right'});y+=40});
    if(l.note){txt('Note: '+l.note,P+94,y+14,{sz:15,c:'#8a6a66',max:700});y+=30}
    txt('Item total',W-P-140,y+18,{sz:15,c:'#8a6a66',a:'right'});txt(m(l.total),W-P,y+18,{sz:20,w:'700',a:'right'});
    y+=40;rule();y+=26;
  });
  txt('Order total (items)',P,y+10,{sz:20,w:'600'});txt(m(o.total),W-P,y+12,{sz:32,w:'700',a:'right'});
  y+=48;
  const dtext=o.delivery?('Delivery requested'+(o.address?': '+o.address:'')):'Delivery not requested (pick-up / to be arranged)';
  const dl1=wrap(dtext,W-2*P-32,17),dl2=wrap(o.shop.deliveryNote,W-2*P-32,15);
  const bh=24+dl1.length*24+10+dl2.length*21+14;
  ctx.fillStyle='#f8eee3';rr(ctx,P,y,W-2*P,bh,14);ctx.fill();
  let by=y+30;dl1.forEach(t=>{txt(t,P+16,by,{sz:17,w:'600'});by+=24});by+=4;dl2.forEach(t=>{txt(t,P+16,by,{sz:15,c:'#6b4a4a'});by+=21});
  y+=bh+26;
  wrap(o.shop.contact,W-2*P,16).forEach(t=>{txt(t,P,y,{sz:16,c:'#6b4a4a'});y+=23});
  txt('Your order is confirmed once we reply to you.',P,y+4,{sz:15,c:'#8a6a66'});
  return y+4+P;
}
async function makeOrderCanvas(o){
  try{await Promise.all(['600 20px "DM Sans"','700 40px "Cormorant Garamond"'].map(f=>document.fonts.load(f)))}catch(e){}
  const imgs={};const items=[];o.lines.forEach(l=>{items.push(l.chain);if(l.free)items.push(l.free);l.extras.forEach(x=>items.push(x.charm))});
  imgs.__logo=await loadImg(LOGO);
  await Promise.all(items.map(async it=>{if(it.img&&!imgs[it.id])imgs[it.id]=await loadImg(it.img)}));
  const t=document.createElement('canvas').getContext('2d');
  const H=Math.ceil(paint(t,o,imgs));
  const S=2,c=document.createElement('canvas');c.width=900*S;c.height=H*S;
  const ctx=c.getContext('2d');ctx.scale(S,S);ctx.fillStyle='#FDFFF0';ctx.fillRect(0,0,900,H);
  paint(ctx,o,imgs);
  return {canvas:c,w:900,h:H};
}
async function createOrderImage(){
  lastOrder=newOrder();lastPng=null;ov='review';renderOverlay();
  try{const r=await makeOrderCanvas(lastOrder);lastOrder.cv=r;lastPng=r.canvas.toDataURL('image/png')}catch(e){toast('Could not create the image.')}
  if(ov==='review')renderOverlay();
}
function downloadBlob(name,blob){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function saveFile(name,blob){downloadBlob(name,blob);toast('Saved! Now send it to us to confirm.')}
const safeName=()=>'order-'+lastOrder.id+(lastOrder.name?'-'+lastOrder.name.replace(/[^\w]+/g,'-').slice(0,20):'');
async function savePng(){if(!lastOrder||!lastOrder.cv)return;const b=await new Promise(r=>lastOrder.cv.canvas.toBlob(r,'image/png'));saveFile(safeName()+'.png',b)}
async function savePdf(){
  if(!lastOrder||!lastOrder.cv)return;
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF tool did not load — please save as image instead.');return}
  const {w,h}=lastOrder.cv;const doc=new window.jspdf.jsPDF({unit:'px',format:[w,h],orientation:w>h?'l':'p',compress:true});
  doc.addImage(lastOrder.cv.canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);
  saveFile(safeName()+'.pdf',doc.output('blob'));
}

/* ---------- builder helpers ---------- */
function openBuilder(chainId,idx){
  const std=data.charms.find(c=>c.standard&&c.available!==false);
  if(idx!=null){const l=cart[idx];builder={chainId:l.chainId,freeId:l.freeId,extras:Object.assign({},l.extras),note:l.note||'',editIndex:idx}}
  else builder={chainId,freeId:std?std.id:null,extras:{},note:'',editIndex:null};
  ov='build';renderOverlay();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  if(a==='bg'){if(e.target!==el)return;ov=null;renderOverlay();return}
  if(a==='close'){ov=null;renderOverlay();return}
  if(a==='filter'){filter=d.v;renderPage()}
  else if(a==='build')openBuilder(d.id);
  else if(a==='free'){builder.freeId=d.id;renderOverlay()}
  else if(a==='qty'){const q=(builder.extras[d.id]||0)+Number(d.d);if(q<=0)delete builder.extras[d.id];else builder.extras[d.id]=Math.min(q,20);renderOverlay()}
  else if(a==='addline'){
    const l={chainId:builder.chainId,freeId:builder.freeId,extras:builder.extras,note:builder.note.trim()};
    if(builder.editIndex!=null)cart[builder.editIndex]=l;else cart.push(l);
    builder=null;ov='cart';renderPage();renderOverlay();
  }
  else if(a==='cart'){ov='cart';renderPage();renderOverlay()}
  else if(a==='editline')openBuilder(null,Number(d.i));
  else if(a==='rmline'){cart.splice(Number(d.i),1);if(!cart.length)ov=null;renderPage();renderOverlay()}
  else if(a==='review')createOrderImage();
  else if(a==='dlpng')savePng();
  else if(a==='dlpdf')savePdf();
  else if(a==='admin'){draft=JSON.parse(JSON.stringify(data));ov='admin';renderOverlay()}
  else if(a==='add'){const k=d.k;draft[k].push(k==='chains'?{id:uid('ch'),name:'New chain',type:'Bracelet',price:0,desc:'',emoji:'⛓️',img:'',available:true}:{id:uid('cm'),name:'New charm',price:0,emoji:'✨',img:'',standard:false,available:true});renderOverlay()}
  else if(a==='del'){if(confirm('Delete this item?')){draft[d.k].splice(Number(d.i),1);renderOverlay()}}
  else if(a==='imgrm'){draft[d.k][Number(d.i)].img='';renderOverlay()}
  else if(a==='save')savePublish();
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.bind){
    const v=t.type==='checkbox'?t.checked:t.value;
    if(d.bind==='b.note')builder.note=v;
    else if(d.bind==='c.name')customer.name=v;
    else if(d.bind==='c.contact')customer.contact=v;
    else if(d.bind==='c.address')customer.address=v;
    else if(d.bind==='c.delivery'){customer.delivery=v;renderOverlay()}
  }else if(d.sf){draft.shop[d.sf]=t.value}
  else if(d.k&&d.f){
    const it=draft[d.k][Number(d.i)];
    if(t.type==='checkbox')it[d.f]=t.checked;
    else if(d.f==='price')it.price=t.value===''?0:Number(t.value);
    else it[d.f]=t.value;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.file){
    const [k,i]=t.dataset.file.split(':');const f=t.files&&t.files[0];if(!f)return;
    try{draft[k][Number(i)].img=await resizeImg(f);renderOverlay()}catch(err){toast('Could not read that image.')}
  }else if(t.dataset.k&&t.type==='checkbox'&&t.dataset.f==='standard'){/* state already updated by input event */}
});

/* ---------- init ---------- */
const checkAdmin=()=>{const v=location.hash==='#admin';if(v!==isOwner){isOwner=v;renderPage()}};
window.addEventListener('hashchange',checkAdmin);
isOwner=location.hash==='#admin';
renderPage();
fetch('catalog.json?v='+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&j.shop&&j.chains&&j.charms){data=j;renderPage()}}).catch(()=>{});
})();
</script>
